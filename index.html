<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Automatizador</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="icon">🤖</div>

            <h1>Mi Automatizador</h1>

            <p class="subtitle">
                Sistema de eventos
            </p>

            <div class="status">
                <span id="statusDot"></span>
                <span id="statusText">Comprobando...</span>
            </div>

            <div class="event">

                <span class="event-label">EVENTO ACTUAL</span>

                <h2 id="eventTitle">
                    Cargando...
                </h2>

                <p id="eventMessage">
                    Esperando información...
                </p>

            </div>

            <p class="updated">
                Última actualización:
                <span id="time">--:--:--</span>
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
